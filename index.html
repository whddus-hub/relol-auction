<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELOL 경매</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e8edf7}header{background:#141e32;padding:18px 22px;border-bottom:1px solid #34435b;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{margin:0;font-size:25px;color:#e9c77c}h2{font-size:18px;margin:0 0 14px}main{max-width:1300px;margin:auto;padding:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel{background:#172238;border:1px solid #31425e;border-radius:14px;padding:18px;margin-bottom:16px}.wide{grid-column:1/-1}button,input,select,textarea{font:inherit}button{background:#304566;color:#fff;border:1px solid #5c7396;padding:10px 14px;border-radius:9px;cursor:pointer}button.primary{background:#b48b39;color:#0b1320;font-weight:800;border:0}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#0e192b;border:1px solid #465a79;color:#fff;border-radius:8px;padding:10px;min-width:0;width:100%}label{font-size:13px;color:#b4c3d8;display:block;margin:8px 0 5px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#9aaec9;font-size:13px}.hero{font-size:30px;font-weight:800;margin:10px 0}.big{font-size:24px;color:#f0c56c}.team{padding:12px;border:1px solid #394c6c;border-radius:10px;margin:8px 0}.team strong{color:#f1cb81}.log{height:230px;overflow:auto;background:#0d1728;border-radius:8px;padding:12px;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #223049}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #34445d;text-align:left}small{color:#9cb0ca}.tag{padding:4px 8px;background:#263c5a;border-radius:7px}.notice{color:#f1ca80}.hidden{display:none!important}@media(max-width:800px){main{display:block}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:15px}h1{font-size:22px}}</style></head><body>
<header><h1>⚔ RELOL AUCTION</h1><div class="flex"><select id="role" style="width:auto"><option value="host">진행자</option><option value="captain">팀장</option></select><select id="who" style="width:auto"></select><button id="reset">초기화</button></div></header>
<main><div><section class="panel"><h2>🎯 현재 경매</h2><div id="status" class="muted"></div><div id="player" class="hero">대기 중</div><div id="details" class="muted"></div><p>현재 최고 입찰 <b class="big" id="price">0</b> P <span id="leader" class="tag">입찰 없음</span></p><div class="flex"><input id="bidAmount" type="number" min="1" value="10" step="10" style="width:125px"><button class="primary" id="bid">입찰하기</button><button id="next">다음 선수</button></div><p id="pauseMsg" class="notice"></p><div class="flex"><button id="pause">팀장 퍼즈 (1회 / 1분)</button><button id="resume">재개</button></div><p class="muted">진행자가 다음 선수를 누르면 현재 최고 입찰 팀에 자동 낙찰됩니다. 입찰이 없으면 유찰 처리됩니다.</p></section><section class="panel"><h2>📜 진행 로그</h2><div id="log" class="log"></div></section></div><div><section class="panel"><h2>🏆 팀 현황</h2><div id="teams"></div></section><section class="panel"><h2>👥 선수 목록 <span id="remaining"></span></h2><div style="overflow:auto;max-height:360px"><table><thead><tr><th>닉네임</th><th>포지션</th><th>티어</th><th>상태</th></tr></thead><tbody id="roster"></tbody></table></div></section></div><section class="panel wide"><h2>⚙ 선수 / 팀 설정</h2><div class="muted">선수 등록 시 모스트 챔피언 1·2·3을 각각 입력할 수 있습니다. 이 페이지의 데이터는 현재 브라우저에만 저장됩니다.</div><div class="fields"><div><label>닉네임</label><input id="name" placeholder="닉네임"></div><div><label>포지션</label><select id="position"><option>TOP</option><option>JUNGLE</option><option>MID</option><option>ADC</option><option>SUP</option><option>FLEX</option></select></div><div><label>티어</label><input id="tier" placeholder="예: 다이아"></div><div><label>모스트 1</label><input id="m1" placeholder="챔피언"></div><div><label>모스트 2</label><input id="m2" placeholder="챔피언"></div><div><label>모스트 3</label><input id="m3" placeholder="챔피언"></div></div><p><button id="add">선수 추가</button> <button id="demo">테스트 데이터 다시 채우기</button></p><div class="flex"><label>팀장 이름</label><input id="teamName" placeholder="팀장 닉네임" style="width:180px"><label>시작 포인트</label><input id="budget" type="number" value="1000" style="width:110px"><button id="addTeam">팀 추가</button></div></section></main>
<script>
const KEY='relol-auction-v1';const champions=['아리','이즈리얼','리 신','징크스','야스오','럭스','오리아나','카이사','쓰레쉬','레넥톤','제드','바이'];const positions=['TOP','JUNGLE','MID','ADC','SUP'];const tiers=['다이아','에메랄드','플래티넘','골드'];
function fresh(){return {teams:Array.from({length:4},(_,i)=>({id:i+1,name:`팀장 ${i+1}`,budget:1000,players:[],pauseUsed:false})),players:Array.from({length:20},(_,i)=>({id:i+1,name:`선수 ${i+1}`,position:positions[i%5],tier:tiers[i%4],most:[champions[i%12],champions[(i+3)%12],champions[(i+6)%12]],status:'대기'})),current:null,price:0,leader:null,pausedBy:null,pauseUntil:null,logs:[]}}let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(msg){s.logs.unshift(`${new Date().toLocaleTimeString('ko-KR')} · ${msg}`);s.logs=s.logs.slice(0,250)}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function team(){return s.teams.find(t=>t.id===Number($('who').value))}function current(){return s.players.find(p=>p.id===s.current)}function host(){return $('role').value==='host'}function finish(){let p=current();if(!p)return;if(s.leader!==null){let t=s.teams.find(x=>x.id===s.leader);if(t){t.budget-=s.price;t.players.push(p.id);p.status=t.name;log(`${p.name} → ${t.name} 낙찰 (${s.price}P)`)}}else{p.status='유찰';log(`${p.name} 유찰`)}s.current=null;s.price=0;s.leader=null}function render(){let h=host(),t=team(),p=current(),paused=s.pausedBy!==null;$('who').classList.toggle('hidden',h);$('who').innerHTML=s.teams.map(x=>`<option value="${x.id}">${safe(x.name)}</option>`).join('');if(t)$('who').value=t.id;else if(s.teams.length)$('who').value=s.teams[0].id;$('status').textContent=paused?'⏸ 경매 일시정지':p?'🔴 경매 진행 중':'⏳ 다음 선수 대기';$('player').textContent=p?p.name:'대기 중';$('details').textContent=p?`${p.position} · ${p.tier} · 모스트: ${p.most.join(' / ')}`:'진행자가 다음 선수를 선택하세요';$('price').textContent=s.price;$('leader').textContent=s.leader===null?'입찰 없음':s.teams.find(x=>x.id===s.leader)?.name||'입찰 없음';$('next').classList.toggle('hidden',!h);$('next').disabled=paused||(!p&&!s.players.some(x=>x.status==='대기'));$('bid').disabled=h||paused||!p||!t;$('pause').classList.toggle('hidden',h);$('pause').disabled=paused||!p||!t||t.pauseUsed;$('resume').classList.toggle('hidden',!paused||h||s.pausedBy!==t?.id);$('pauseMsg').textContent=paused?`${s.teams.find(x=>x.id===s.pausedBy)?.name||'팀장'} 퍼즈 사용 중 · 해당 팀장이 재개 가능 (최대 1분)`:'';$('teams').innerHTML=s.teams.map(x=>`<div class="team"><strong>${safe(x.name)}</strong> · 잔여 ${x.budget}P · 퍼즈 ${x.pauseUsed?'사용 완료':'가능'}<div class="muted">${x.players.map(id=>safe(s.players.find(p=>p.id===id)?.name)).join(', ')||'낙찰 선수 없음'}</div></div>`).join('');$('remaining').textContent=`(${s.players.filter(x=>x.status==='대기').length}명 남음)`;$('roster').innerHTML=s.players.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.position)}</td><td>${safe(x.tier)}</td><td>${s.current===x.id?'경매 중':safe(x.status)}</td></tr>`).join('');$('log').innerHTML=s.logs.map(x=>`<div>${safe(x)}</div>`).join('')||'아직 로그가 없습니다';save()}
$('role').onchange=render;$('who').onchange=render;$('bid').onclick=()=>{let t=team(),amount=Number($('bidAmount').value);if(!t||!current()||s.pausedBy!==null)return;if(!Number.isInteger(amount)||amount<=s.price||amount>t.budget){alert('현재 최고 입찰보다 높고 팀 잔여 포인트 이하인 정수를 입력하세요.');return}s.price=amount;s.leader=t.id;log(`${t.name} ${amount}P 입찰`);render()};$('next').onclick=()=>{if(!host()||s.pausedBy!==null)return;if(current())finish();let p=s.players.find(x=>x.status==='대기');if(p){s.current=p.id;log(`진행자: ${p.name} 경매 시작`)}else log('진행자: 모든 선수 경매 종료');render()};$('pause').onclick=()=>{let t=team();if(host()||!t||t.pauseUsed||!current()||s.pausedBy!==null)return;t.pauseUsed=true;s.pausedBy=t.id;s.pauseUntil=Date.now()+60000;log(`${t.name} 퍼즈 사용 (최대 1분)`);render()};function resume(auto=false){let t=s.teams.find(x=>x.id===s.pausedBy);if(!t)return;log(`${t.name} 퍼즈 ${auto?'1분 만료로 자동 재개':'직접 재개'}`);s.pausedBy=null;s.pauseUntil=null;render()}$('resume').onclick=()=>{if(team()?.id===s.pausedBy)resume()};setInterval(()=>{if(s.pausedBy!==null&&Date.now()>=s.pauseUntil)resume(true)},1000);$('add').onclick=()=>{let name=$('name').value.trim();if(!name)return alert('닉네임을 입력하세요');s.players.push({id:Math.max(0,...s.players.map(p=>p.id))+1,name,position:$('position').value,tier:$('tier').value.trim()||'미입력',most:[$('m1').value,$('m2').value,$('m3').value].map(v=>v.trim()||'-'),status:'대기'});['name','tier','m1','m2','m3'].forEach(id=>$(id).value='');render()};$('addTeam').onclick=()=>{let name=$('teamName').value.trim(),budget=Number($('budget').value);if(!name||!Number.isInteger(budget)||budget<1)return alert('팀장 이름과 올바른 시작 포인트를 입력하세요');s.teams.push({id:Math.max(0,...s.teams.map(t=>t.id))+1,name,budget,players:[],pauseUsed:false});$('teamName').value='';render()};$('demo').onclick=()=>{if(confirm('모든 경매 데이터를 테스트 데이터로 초기화할까요?')){s=fresh();render()}};$('reset').onclick=()=>{if(confirm('경매 데이터와 로그를 모두 초기화할까요?')){s=fresh();render()}};render();
</script></body></html>
